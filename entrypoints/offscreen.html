<!doctype html>
<html>
<head><meta charset="utf-8"><title>FeedTube</title></head>
<body>
<script type="module">
console.log('[SC offscreen] loaded, registering listener');
chrome.runtime.onMessage.addListener((message, _sender, sendResponse) => {
  console.log('[SC offscreen] got message:', message?.type, message?.url?.substring(0, 80));
  if (message?.type === 'sc-fetch-text') {
    handleFetchText(message.url).then(r => { console.log('[SC offscreen] text done:', r.status); sendResponse(r); });
    return true;
  }
  if (message?.type === 'sc-fetch-json') {
    handleFetchJson(message.url).then(r => { console.log('[SC offscreen] json done:', r.status); sendResponse(r); });
    return true;
  }
});

async function handleFetchText(url) {
  try {
    const res = await fetch(url);
    const text = await res.text();
    console.log('[SC offscreen] fetchText', url.substring(0, 80), '->', res.status, 'len', text.length);
    return { ok: res.ok, status: res.status, text };
  } catch (e) {
    console.error('[SC offscreen] fetchText error:', e);
    return { ok: false, status: 0, text: e?.message ?? String(e) };
  }
}

async function handleFetchJson(url) {
  try {
    const res = await fetch(url, { headers: { Accept: 'application/json' } });
    const text = await res.text();
    console.log('[SC offscreen] fetchJson', url.substring(0, 80), '->', res.status, 'len', text.length);
    return { ok: res.ok, status: res.status, text };
  } catch (e) {
    console.error('[SC offscreen] fetchJson error:', e);
    return { ok: false, status: 0, text: e?.message ?? String(e) };
  }
}
</script>
</body>
</html>
